

# Dialecte de Hibernate
org.fundaciobit.pinbaladmin.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
# org.fundaciobit.pinbaladmin.hibernate.dialect=org.hibernate.dialect.MySQLDialect      
# org.fundaciobit.pinbaladmin.hibernate.dialect=org.hibernate.dialect.DB2Dialect
# org.fundaciobit.pinbaladmin.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# org.fundaciobit.pinbaladmin.hibernate.dialect=net.sf.hibernate.dialect.Oracle9Dialect

# org.fundaciobit.pinbaladmin.hibernate.dialect=org.hibernate.dialect.Oracle12cDialect
# org.fundaciobit.pinbaladmin.hibernate.query.substitutions=true 1, false 0
org.fundaciobit.pinbaladmin.hibernate.show_sql=false
org.fundaciobit.pinbaladmin.hibernate.format_sql=false


# Propietat que indica als projectes que activin les caracteristiques
# especials requerides en l'entorn de la CAIB (Govern Balear) si val true -->
org.fundaciobit.pinbaladmin.iscaib=false


#  Tipus de FileSystemManager
org.fundaciobit.pinbaladmin.filesystemmanagerclass=org.fundaciobit.genapp.common.filesystem.SimpleFileSystemManager
#  Si volem distribuir els fitxers en directoris, llavors utilitzar aquesta classe.
#  Revisar punt "Migracio de 1.1.4 a 2.0.0 del 'Manual de Migracions'
#org.fundaciobit.pinbaladmin.filesystemmanagerclass=org.fundaciobit.genapp.common.filesystem.ThreeFolderFileSystemManager

org.fundaciobit.pinbaladmin.defaultlanguage=ca

org.fundaciobit.pinbaladmin.development=false

#  Clau per encriptar l'identificador del fitxers a descarregar via web(IMPORTANT tamany de 16 caràcters) -->
org.fundaciobit.pinbaladmin.encryptkey=1234567890123456

#  Llistat de Plugins per l'exportació de dades en els llistats (excel, ods, csv, ...) -->
# org.fundaciobit.pinbaladmin.exportdataplugins=org.fundaciobit.pluginsib.exportdata.cvs.CSVPlugin,org.fundaciobitib.plugins.exportdata.ods.ODSPlugin,org.fundaciobit.pluginsib.exportdata.excel.ExcelPlugin

# From per quan enviam correus
org.fundaciobit.pinbaladmin.email.from=pinbaladmin@pinbaladmin.org

